version: 2

# NOTE on Elementary anomaly tests:
# volume_anomalies / dimension_anomalies / column_anomalies are
# intentionally NOT used on this model. As of elementary v0.25.1, their
# DuckDB dispatch generates a tuple-comparison subquery
# ("(a, b) IN (SELECT x, y FROM ...)"), a pattern DuckDB does not
# support (see DuckDB issue #20289: "Subquery returns 2 columns -
# expected 1"). This is a confirmed upstream compatibility gap between
# Elementary and DuckDB, not a project configuration issue. Elementary's
# schema tracking, test-result history, and the `edr report` command all
# work correctly and are used in this project; only the anomaly-scoring
# generic tests are affected.

models:
  - name: mart_qlfs_time_series
    description: >
      One row per (quarter, metric) -- the final, dashboard-ready QLFS
      time series. Built on top of stg_qlfs_conformed, which already
      handles schema drift and label conformance, so this model is
      pure presentation logic. Uniqueness of (period_date, metric_name)
      is enforced by tests/assert_unique_period_metric.sql.
    columns:
      - name: period_date
        description: First day of the quarter (e.g. 2025-01-01 for Q1 2025)
        data_tests:
          - not_null

      - name: metric_name
        data_tests:
          - not_null

      - name: value
        description: The metric's value for this quarter (thousands, or a percentage for rate metrics)
        data_tests:
          - not_null
